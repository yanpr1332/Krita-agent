name: Manual offline Python tests
# Intentionally manual only: no push / pull_request triggers.
on:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install offline test requirements
        run: python -m pip install -e ".[test]"
      - name: Run offline tests (no Krita GUI)
        run: python -m pytest -q
