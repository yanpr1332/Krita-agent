name: Experimental distro Krita native fallback (Linux Xvfb)

# Bounded fallback to diagnose native painting independently of the large
# versioned AppImage download. This tests Ubuntu's Krita 5.2.2 only.
on:
  workflow_dispatch:
  push:
    branches:
      - infra/cloud-tiered-acceptance
    paths:
      - '.github/workflows/cloud-krita-distro-smoke.yml'

concurrency:
  group: cloud-distro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-distro:
    name: Genuine distro Krita Bridge + native KRA reopen (experimental)
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ubuntu Krita and virtual display
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            krita krita-data python3-pyqt5 xvfb xauth openbox dbus-x11 \
            libgl1-mesa-dri libxkbcommon-x11-0
      - name: Install external probe dependencies
        run: python -m pip install -e '.[feedback]'
      - name: Run real Bridge native brush and KRA reopen
        env:
          KRITA_NATIVE_BINARY: /usr/bin/krita
        run: |
          chmod +x scripts/cloud_krita_runner.sh
          xvfb-run -a -s '-screen 0 1366x900x24 -ac +extension GLX +render' \
            bash scripts/cloud_krita_runner.sh
      - name: Upload actual synthetic native evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-krita-ubuntu-distro-fallback
          path: ${{ runner.temp }}/krita-native-pilot/artifacts/
          if-no-files-found: warn
          retention-days: 3
