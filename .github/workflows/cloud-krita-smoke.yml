name: Experimental real Krita cloud smoke (Linux Xvfb)

on:
  workflow_dispatch:
  push:
    branches:
      - infra/cloud-tiered-acceptance
    paths:
      - '.github/workflows/cloud-krita-smoke.yml'
      - 'scripts/cloud_native_probe.py'
      - 'scripts/cloud_krita_runner.sh'
      - 'plugin/krita_agent_bridge/**'
      - 'plugin/krita_agent_bridge.desktop'
      - 'src/krita_agent/client.py'
      - 'src/krita_agent/artifact_integrity.py'

concurrency:
  group: cloud-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-gate:
    name: Fast offline contract gate before costly Krita download
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and probe dependencies
        run: python -m pip install -e '.[test,feedback]'
      - name: Compile and run isolated Bridge protocol smoke tests
        run: |
          python -m compileall -q src plugin scripts tests
          python -m pytest -q tests/test_cloud_contract_bridge.py

  native-appimage:
    name: Actual Krita 5.3.4.1 AppImage + Bridge + KRA reopen
    needs: source-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify preinstalled Xvfb tools (avoid hanging apt repositories)
        run: |
          command -v Xvfb
          command -v xvfb-run
          command -v xauth
          command -v curl
      - name: Install external probe dependencies
        run: python -m pip install -e '.[feedback]'
      - name: Obtain official Krita 5.3.4.1 Linux AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/krita-native-pilot/download"
          cd "$RUNNER_TEMP/krita-native-pilot/download"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 240 \
            'https://download.kde.org/stable/krita/5.3.4.1/krita-5.3.4.1-x86_64.AppImage' \
            --output Krita.AppImage
          test "$(stat -c%s Krita.AppImage)" -ge 350000000
          sha256sum Krita.AppImage > "$RUNNER_TEMP/krita-native-pilot/appimage-sha256.txt"
          chmod +x Krita.AppImage
          ./Krita.AppImage --appimage-extract > "$RUNNER_TEMP/krita-native-pilot/appimage-extract.log" 2>&1
          test -x squashfs-root/AppRun
      - name: Run genuine native Krita Bridge test under Xvfb
        env:
          KRITA_NATIVE_BINARY: ${{ runner.temp }}/krita-native-pilot/appimage-runner.sh
        run: |
          cat > "$RUNNER_TEMP/krita-native-pilot/appimage-runner.sh" <<'EOF'
          #!/usr/bin/env bash
          export APPDIR="$RUNNER_TEMP/krita-native-pilot/download/squashfs-root"
          export APPIMAGE="$RUNNER_TEMP/krita-native-pilot/download/Krita.AppImage"
          exec "$APPDIR/AppRun" "$@"
          EOF
          chmod +x "$KRITA_NATIVE_BINARY" scripts/cloud_krita_runner.sh
          xvfb-run -a -s '-screen 0 1366x900x24 -ac +extension GLX +render' \
            bash scripts/cloud_krita_runner.sh
      - name: Upload synthetic native evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-krita-official-appimage-pilot
          path: ${{ runner.temp }}/krita-native-pilot/artifacts/
          if-no-files-found: warn
          retention-days: 3
