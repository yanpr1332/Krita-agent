[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "krita-agent"
version = "0.5.0.dev0"
description = "Local, authenticated Krita native painting automation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yan Pengrui"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
feedback = ["Pillow>=10"]

[project.scripts]
krita-agent = "krita_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
